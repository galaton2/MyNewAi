<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nova — ИИ-чат</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--a:74,168,255;--ink:#f1f6ff;--dim:#8a97ab;--blue:rgb(var(--a));--ice:color-mix(in srgb,var(--blue) 25%,#fff);--line:rgba(255,255,255,.1);
--f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--f-head:"Unbounded","Onest",system-ui,sans-serif;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root.kb{padding-bottom:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:#000;color:var(--ink);font:400 16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i-star,.i-stop{fill:currentColor;stroke:none}
.i-check{display:none}.ok>.i-check{display:block}.ok>.i-copy{display:none}
.app{position:relative;z-index:1;height:100%;display:flex}
.kb .app{height:calc(var(--vh) - env(safe-area-inset-top,0px))}

.av{width:34px;height:34px;flex:none;display:grid;place-items:center}
.logo{width:100%;height:100%;display:block;color:#ff1f7a;filter:drop-shadow(0 0 5px currentColor)}
.sp{transform-origin:50px 50px}
.brand .logo,.empty .logo,.av.live .logo,.m.live>.av .logo{animation:turn 10s linear infinite,hue 8s ease-in-out infinite;animation-delay:0s,var(--d,0s)}
.brand .sp,.empty .sp,.av.live .sp,.m.live>.av .sp{animation:turn 4s linear infinite reverse}
.av.live .logo,.m.live>.av .logo{animation-duration:2.6s,8s}
.av.live .sp,.m.live>.av .sp{animation-duration:1.4s}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes hue{0%,100%{color:#ff1f7a}50%{color:#2f8bff}}
@keyframes spin{50%{transform:rotate(180deg) scale(1.3)}100%{transform:rotate(360deg)}}
@keyframes glow{50%{box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),0 6px 36px rgba(var(--a),.85)}}

.side{width:272px;flex:none;display:flex;flex-direction:column;gap:14px;padding:20px 14px 14px;min-height:0;background:rgba(3,5,9,.72);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;padding:0 6px 4px;font:700 18px var(--f-head);letter-spacing:-.01em}
.new{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:rgba(var(--a),.13);border:1px solid rgba(var(--a),.4);font-weight:500;transition:background .2s,transform .2s cubic-bezier(.3,1.5,.5,1)}
.new:hover{background:rgba(var(--a),.24)}.new:active{transform:scale(.96)}
.sf{position:relative}
.sf .i{position:absolute;left:13px;top:50%;margin-top:-9px;width:18px;height:18px;color:var(--dim)}
.search{width:100%;padding:10px 14px 10px 40px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);font:400 14.5px var(--f-body);outline:0;transition:border-color .2s,background .2s}
.search:focus{border-color:var(--blue);background:rgba(255,255,255,.07)}
.list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;min-height:0}
.item{position:relative;display:flex;align-items:center;border-radius:12px;padding:0 4px 0 12px;transition:background .2s}
.item:hover{background:rgba(255,255,255,.06)}.item.on{background:rgba(255,255,255,.09)}
.item.on::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:3px;border-radius:3px;background:var(--blue);box-shadow:0 0 10px var(--blue)}
.item .t{flex:1;min-width:0;text-align:left;padding:10px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#d8e3f3;font-size:14.5px}
.item .s{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;color:var(--dim);opacity:0;transition:opacity .2s,color .2s,background .2s}
.item .s .i{width:16px;height:16px}
.item:hover .s,.item:focus-within .s{opacity:1}
.item .s:hover{color:#fff;background:rgba(255,255,255,.1)}
.item.pin .p{opacity:1;color:var(--blue)}.item.pin .p .i{fill:currentColor}
.item input{flex:1;min-width:0;background:rgba(0,0,0,.5);border:1px solid var(--blue);border-radius:8px;color:var(--ink);font:inherit;font-size:14.5px;padding:6px 8px;margin:4px 0;outline:0}
.none{color:var(--dim);font-size:14px;padding:6px 12px}
.scrim{display:none}

.chat{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;position:relative}
header{display:flex;align-items:center;gap:4px;padding:10px 14px 6px;min-height:56px}
header h1{flex:1;margin:0;font:500 14.5px var(--f-body);color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--dim);transition:background .2s,color .2s,transform .2s}
.ib:hover{background:rgba(255,255,255,.08);color:#fff}.ib:active{transform:scale(.9)}
.menu,.plus{display:none}
#scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;scroll-behavior:smooth;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 24px,#000 calc(100% - 16px),transparent);mask-image:linear-gradient(to bottom,transparent,#000 24px,#000 calc(100% - 16px),transparent)}
#thread{max-width:780px;margin:0 auto;padding:24px 20px 12px;display:flex;flex-direction:column;gap:24px;min-height:100%;text-shadow:0 0 6px #000,0 0 18px #000}
#thread.swap{animation:swap .45s cubic-bezier(.2,.8,.2,1)}
@keyframes swap{from{opacity:0;transform:translateY(12px)}}
.still .m{animation:none}

.empty{margin:auto;text-align:center;padding:24px 0}
.empty .av{width:92px;height:92px;margin:0 auto;animation:rise .8s both,float 5s 1s ease-in-out infinite}
.empty .av .i{width:36px;height:36px}
@keyframes float{50%{transform:translateY(-8px)}}
.empty h2{margin:26px 0 12px;font:700 clamp(30px,7.2vw,56px)/1.12 var(--f-head);letter-spacing:-.03em}
.ln{display:block}.ln.d{color:#7d8aa0}
.w{display:inline-block;white-space:nowrap}
.c{display:inline-block;animation:rise .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*40ms + 200ms)}
@keyframes rise{from{opacity:0;filter:blur(12px);transform:translateY(22px) scale(.92)}}
.empty p{margin:0 auto 30px;color:#aebcd0;max-width:32ch;animation:rise .8s 1s cubic-bezier(.2,.8,.2,1) both}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:600px;margin:0 auto}
.chip{position:relative;display:grid;grid-template-columns:auto 1fr;gap:1px 14px;align-items:center;padding:16px;border-radius:20px;text-align:left;border:1px solid var(--line);background:radial-gradient(200px circle at var(--mx,50%) var(--my,-40%),rgba(var(--a),.22),transparent 70%),rgba(8,12,20,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:border-color .25s,transform .3s cubic-bezier(.3,1.4,.5,1);animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(1.2s + var(--i)*100ms)}
.chip:hover{border-color:rgba(var(--a),.6);transform:translateY(-3px)}.chip:active{transform:scale(.97)}
.chip .i{grid-row:1/3;width:24px;height:24px;color:var(--blue)}
.chip b{font-weight:600;font-size:15px;color:#fff}
.chip span{font-size:13px;color:var(--dim)}

.m{display:flex;gap:12px;align-items:flex-start;animation:in .5s cubic-bezier(.2,1.1,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.96)}}
.m.me{justify-content:flex-end;transform-origin:100% 100%}
.m.me .b{max-width:84%;padding:11px 16px;border-radius:20px 20px 6px 20px;background:rgba(255,255,255,.09);border:1px solid var(--line);color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);text-shadow:none}
.m .av{margin-top:1px}
.col{min-width:0;flex:1;max-width:68ch;font-size:16.5px;line-height:1.7;color:#eaf2ff}
.b .tx{white-space:pre-wrap;overflow-wrap:anywhere}
.b .tx:empty{display:none}
.b .tx+.code,.b .code+.tx,.b .code+.code{margin-top:10px}
.b code{font:500 .9em ui-monospace,Menlo,Consolas,monospace;background:rgba(var(--a),.18);padding:1px 6px;border-radius:6px}
.live .b .tx:last-child::after{content:"";display:inline-block;width:8px;height:1.05em;margin-left:3px;vertical-align:-2px;border-radius:2px;background:var(--blue);box-shadow:0 0 12px var(--blue);animation:bl .9s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.think{padding-top:5px;background:linear-gradient(90deg,#5a7391 30%,#fff 50%,#5a7391 70%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none;animation:shim 1.6s linear infinite}
@keyframes shim{to{background-position:-250% 0}}
.code{border:1px solid var(--line);border-radius:14px;background:#05080e;overflow:hidden;text-shadow:none}
.ch{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 6px 16px;background:rgba(255,255,255,.04);border-bottom:1px solid var(--line);font-size:12px;color:var(--dim)}
.cp{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;border-radius:8px;font-size:12px;color:var(--dim);transition:background .2s,color .2s}
.cp .i{width:14px;height:14px}.cp:hover{background:rgba(255,255,255,.1);color:#fff}.cp.ok{color:#7be0a4}
.code pre{margin:0;padding:16px;overflow-x:auto;font:400 13.5px/1.6 ui-monospace,Menlo,Consolas,monospace;color:#d6ebff}
.k{color:#ff9ac1}.s2{color:#9be3b0}.n{color:#ffcf8a}.cm{color:#6d849d}
.acts{display:flex;gap:2px;margin-top:8px;opacity:0;transition:opacity .25s}
.m:hover .acts,.m:focus-within .acts{opacity:1}
.acts button{min-width:32px;height:32px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:9px;color:var(--dim);font-size:13px;text-shadow:none;transition:color .15s,background .15s,transform .15s}
.acts .i{width:17px;height:17px}
.acts button:hover{color:#fff;background:rgba(255,255,255,.09)}.acts button:active{transform:scale(.85)}
.acts .on{color:var(--blue)}.acts .on .i{animation:pop .45s}.acts .ok{color:#7be0a4}
.acts .rg{padding:0 10px 0 8px}
@keyframes pop{40%{transform:scale(1.5) rotate(-8deg)}}

form{padding:6px 16px 12px}
.att{display:flex;gap:8px;flex-wrap:wrap;max-width:780px;margin:0 auto 8px}.att:empty{display:none}
.fc{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:12px;background:rgba(8,12,20,.85);border:1px solid var(--line);font-size:13px;color:var(--ice);text-shadow:none;animation:in .3s}
.b .fc{margin-top:8px}
.fc img{width:28px;height:28px;border-radius:7px;object-fit:cover}
.fc button{width:22px;height:22px;display:grid;place-items:center;border-radius:50%;color:var(--dim)}.fc button .i{width:14px;height:14px}
.box{max-width:780px;margin:0 auto;display:flex;align-items:flex-end;gap:4px;padding:8px;border-radius:28px;background:rgba(9,13,21,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 20px 50px rgba(0,0,0,.5);transition:border-color .3s,box-shadow .3s}
.box:focus-within{border-color:rgba(var(--a),.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 0 0 4px rgba(var(--a),.14),0 0 60px rgba(var(--a),.28)}
textarea{flex:1;resize:none;border:0;outline:0;background:none;color:var(--ink);font:400 16px/1.5 var(--f-body);padding:10px 6px;max-height:160px;min-width:0}
textarea::placeholder{color:#66768c}
.tb{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--dim);transition:color .2s,background .2s,transform .2s}
.tb[hidden]{display:none}.tb:hover{color:#fff;background:rgba(255,255,255,.08)}.tb:active{transform:scale(.88)}
.tb.rec{color:#ff6b7d;animation:ring 1.2s infinite}
.send{position:relative;width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--blue);color:#02101f;transition:transform .25s cubic-bezier(.3,1.5,.5,1),background .2s,box-shadow .3s,color .2s}
.send .i{position:absolute;stroke-width:2.4;transition:opacity .25s,transform .4s cubic-bezier(.3,1.5,.5,1)}
.send .i-stop{width:16px;height:16px;opacity:0;transform:rotate(-90deg) scale(.4)}
.send.busy .i-up{opacity:0;transform:rotate(90deg) scale(.4)}.send.busy .i-stop{opacity:1;transform:none}
.send:not(:disabled){box-shadow:0 4px 24px rgba(var(--a),.55)}.send:not(:disabled):hover{transform:scale(1.1)}.send:not(:disabled):active{transform:scale(.88)}
.send:disabled{background:rgba(255,255,255,.08);color:#5d6a7d;cursor:default}
.send.busy{animation:ring 1.4s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(var(--a),.7)}100%{box-shadow:0 0 0 16px rgba(var(--a),0)}}
.hint{text-align:center;color:#5a6b82;font-size:12.5px;margin-top:8px;text-shadow:0 0 8px #000}
.fab{position:absolute;right:16px;bottom:124px;width:42px;height:42px;border-radius:50%;display:none;place-items:center;background:rgba(9,13,21,.9);border:1px solid var(--line);color:var(--ice);z-index:5}
.fab.on{display:grid;animation:in .35s}.fab:hover{border-color:var(--blue)}

.pop{position:absolute;right:14px;top:54px;z-index:10;width:280px;padding:18px;border-radius:22px;background:rgba(5,9,16,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.6);display:none;flex-direction:column;gap:16px;transform-origin:100% 0}
.pop.on{display:flex;animation:popin .3s cubic-bezier(.2,1.3,.4,1)}
@keyframes popin{from{opacity:0;transform:scale(.9) translateY(-6px)}}
.pop h3{margin:0 0 8px;font:500 13px var(--f-body);color:var(--dim)}
.seg{display:flex;gap:4px;padding:3px;border-radius:12px;background:rgba(255,255,255,.06)}
.seg button{flex:1;padding:7px 0;border-radius:9px;font-size:13.5px;color:var(--dim);transition:background .2s,color .2s}
.seg button.on{background:rgba(var(--a),.32);color:#fff}
.sws{display:flex;gap:12px}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 2px #05090f;transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.sw:hover{transform:scale(1.15)}.sw.on{border-color:#fff}
.pop .act{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;text-align:left;font-size:14px;background:rgba(255,255,255,.06);transition:background .2s}
.pop .act:hover{background:rgba(255,255,255,.12)}.pop .act .i{width:17px;height:17px;color:var(--dim)}.pop .act.ok{color:#7be0a4}

@media (min-width:821px){.side{animation:sl .8s cubic-bezier(.2,.8,.2,1) both}form{animation:rise .8s .5s cubic-bezier(.2,.8,.2,1) both}}
@keyframes sl{from{transform:translateX(-30px);opacity:0}}
@media (max-width:820px){
  .menu,.plus{display:grid}
  .side{position:fixed;z-index:20;left:0;top:0;bottom:0;width:min(320px,86vw);border-radius:0 24px 24px 0;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-102%);transition:transform .35s cubic-bezier(.3,.8,.3,1);background:rgba(3,5,9,.94)}
  .scrim{display:block;position:fixed;inset:0;z-index:19;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .3s}
  body.nav .side{transform:none}body.nav .scrim{opacity:1;pointer-events:auto}
  header{padding:6px 8px 4px}
  #thread{padding:16px 14px 8px}
  form{padding:4px 10px 8px}
  .chips{grid-template-columns:1fr}
  .m.me .b{max-width:90%}
  .hint{display:none}
  .fab{bottom:96px}
}
@media (hover:none){.item .s,.acts{opacity:.8}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></symbol><symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol><symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol><symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol><symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></symbol><symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2c.6 5.4 4.6 9.4 10 10-5.4.6-9.4 4.6-10 10-.6-5.4-4.6-9.4-10-10 5.4-.6 9.4-4.6 10-10Z"/></symbol><symbol id="i-bulb" viewBox="0 0 24 24"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4"/></symbol><symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"/></symbol><symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol><symbol id="i-code" viewBox="0 0 24 24"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></symbol></defs></svg>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="app">
  <aside class="side" id="side" aria-label="Чаты">
    <div class="brand"><span class="av" id="bav"></span>Nova</div>
    <button class="new" id="new" type="button"><svg class="i i-plus" aria-hidden="true"><use href="#i-plus"/></svg>Новый чат</button>
    <div class="sf"><svg class="i i-search" aria-hidden="true"><use href="#i-search"/></svg><input class="search" id="q" placeholder="Поиск по чатам" aria-label="Поиск по чатам" autocomplete="off"></div>
    <div class="list" id="list"></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="chat">
    <header>
      <button class="ib menu" id="menu" type="button" aria-label="Открыть чаты"><svg class="i i-menu" aria-hidden="true"><use href="#i-menu"/></svg></button>
      <h1 id="title">Новый чат</h1>
      <button class="ib plus" id="plus" type="button" aria-label="Новый чат"><svg class="i i-plus" aria-hidden="true"><use href="#i-plus"/></svg></button>
      <button class="ib" id="gear" type="button" aria-label="Настройки"><svg class="i i-sliders" aria-hidden="true"><use href="#i-sliders"/></svg></button>
    </header>
    <div class="pop" id="pop">
      <div><h3>Фон</h3><div class="seg"><button type="button" data-fx="0">Живой</button><button type="button" data-fx="1">Спокойный</button><button type="button" data-fx="2">Выкл</button></div></div>
      <div><h3>Цвет</h3><div class="sws"><button class="sw" type="button" data-hue="0" aria-label="Синий" style="background:#4aa8ff"></button><button class="sw" type="button" data-hue="1" aria-label="Фиолетовый" style="background:#a07dff"></button><button class="sw" type="button" data-hue="2" aria-label="Зелёный" style="background:#3cd296"></button><button class="sw" type="button" data-hue="3" aria-label="Розовый" style="background:#ff78af"></button></div></div>
      <button class="act" id="exp" type="button"><svg class="i i-copy" aria-hidden="true"><use href="#i-copy"/></svg><svg class="i i-check" aria-hidden="true"><use href="#i-check"/></svg>Скопировать переписку</button>
      <button class="act" id="clr" type="button"><svg class="i i-trash" aria-hidden="true"><use href="#i-trash"/></svg>Удалить все чаты</button>
    </div>
    <div id="scroll"><div id="thread" aria-live="polite"></div></div>
    <form id="f" autocomplete="off">
      <div class="att" id="att"></div>
      <div class="box">
        <button class="tb" id="clip" type="button" aria-label="Прикрепить файл"><svg class="i i-clip" aria-hidden="true"><use href="#i-clip"/></svg></button><input type="file" id="file" multiple hidden>
        <textarea id="ta" rows="1" placeholder="Что у тебя на уме?" aria-label="Сообщение"></textarea>
        <button class="tb" id="mic" type="button" aria-label="Голосовой ввод" hidden><svg class="i i-mic" aria-hidden="true"><use href="#i-mic"/></svg></button>
        <button class="send" id="send" type="submit" aria-label="Отправить" disabled></button>
      </div>
      <div class="hint">Enter — отправить · Shift+Enter — перенос строки</div>
    </form>
    <button class="fab" id="fab" type="button" aria-label="Вниз"><svg class="i i-down" aria-hidden="true"><use href="#i-down"/></svg></button>
  </main>
</div>

<script>
/* ===== ИИ: сейчас имитация. Замени тело askAI на свой запрос =====
   history — массив {role:'me'|'ai', text, files:[имена]}; ctx.files — прикреплённые File.
   Верни строку целиком ИЛИ async-генератор с кусочками текста (настоящий стриминг):
   async function* askAI(history, ctx){ const r = await fetch('/api/chat', {method:'POST', body: JSON.stringify({history})});
     const rd = r.body.getReader(), dec = new TextDecoder(); for(;;){ const {done, value} = await rd.read(); if(done) return; yield dec.decode(value, {stream:true}); } } */
async function askAI(history, ctx){
  await sleep(900 + Math.random()*800);
  const q = history[history.length-1].text.toLowerCase();
  if(/привет|здравств|хай/.test(q)) return "Привет! Я **Nova**. Пока я демо-версия, но уже умею красиво отвечать. О чём поговорим?";
  if(/код|js|python|скрипт/.test(q)) return "Держи пример на JavaScript:\n```js\nasync function askAI(history) {\n  const r = await fetch('/api/chat', {\n    method: 'POST',\n    body: JSON.stringify({ history })\n  });\n  return (await r.json()).text;\n}\n```\nВставь свой адрес вместо `/api/chat`, и всё заработает.";
  if(/назван|придума/.test(q)) return "Вот несколько вариантов:\n\n• **Орбита**\n• **Полутон**\n• **Сигнал**\n• **Растр**\n\nМогу подобрать ещё, если расскажешь, о чём проект.";
  if(/план|тренир/.test(q)) return "План на неделю:\n\nПн — ноги и кор\nВт — отдых или прогулка\nСр — спина и плечи\nЧт — кардио 30 минут\nПт — грудь и руки\nСб — длинная прогулка\nВс — отдых";
  return "Это демо-ответ. Настоящая модель подключается в функции `askAI()` в начале скрипта: достаточно вернуть из неё текст.";
}
/* ================================================================ */

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const el = (t, c, x) => { const e = document.createElement(t); if(c) e.className = c; if(x != null) e.textContent = x; return e; };
const ic = n => '<svg class="i i-' + n + '" aria-hidden="true"><use href="#i-' + n + '"/></svg>';
const SPIRAL = (() => { let d = ""; for(let a = 0; a <= 38.9; a += .25){ const r = 7.4*a/6.2832; d += (a ? "L" : "M") + (50 + r*Math.cos(a)).toFixed(1) + " " + (50 + r*Math.sin(a)).toFixed(1); } return d; })();
const STAR = [...Array(10)].map((_,i) => { const a = -Math.PI/2 + i*Math.PI/5, r = i % 2 ? 20 : 47; return (50 + r*Math.cos(a)).toFixed(1) + "," + (50 + r*Math.sin(a)).toFixed(1); }).join(" ");
document.querySelector("svg defs").insertAdjacentHTML("beforeend", '<clipPath id="stc"><polygon points="' + STAR + '"/></clipPath>');
const logo = () => '<svg class="logo" viewBox="0 0 100 100" aria-hidden="true" style="--d:-' + (performance.now()/1000 % 8).toFixed(2) + 's"><g clip-path="url(#stc)"><path class="sp" d="' + SPIRAL + '" fill="none" stroke="currentColor" stroke-width="4.3" stroke-linecap="round" stroke-linejoin="round"/></g></svg>';
const av = () => { const a = el("span","av"); a.innerHTML = logo(); return a; };
const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function hl(c){
  return esc(c).replace(/(\/\/[^\n]*)|('(?:[^'\\\n]|\\.)*'|"(?:[^"\\\n]|\\.)*"|`[^`]*`)|\b(const|let|var|function|async|await|return|if|else|for|while|import|from|export|class|new|def|try|catch|throw|true|false|null|None)\b|\b(\d+\.?\d*)\b/g,
    (m,a,b,k) => '<span class="' + (a ? "cm" : b ? "s2" : k ? "k" : "n") + '">' + m + "</span>");
}
function md(s){
  return s.split("```").map((p,i) => i % 2
    ? '<div class="code"><div class="ch"><span>' + esc(p.match(/^[^\n]*/)[0].trim() || "код") + '</span><button type="button" class="cp"><svg class="i i-copy" aria-hidden="true"><use href="#i-copy"/></svg><svg class="i i-check" aria-hidden="true"><use href="#i-check"/></svg>Копировать</button></div><pre>' + hl(p.replace(/^[^\n]*\n/,"")) + "</pre></div>"
    : '<div class="tx">' + esc(p.trim()).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`\n]+)`/g,"<code>$1</code>") + "</div>").join("");
}
const SEND = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
const STOP = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="3"/></svg>';
const SUGGEST = [
  {i:"bulb", t:"Придумать название", d:"Для проекта, бота или канала", q:"Придумай название для проекта"},
  {i:"help", t:"Объяснить простыми словами", d:"Как работает нейросеть", q:"Объясни, как работает нейросеть"},
  {i:"cal", t:"Составить план", d:"Тренировки на неделю", q:"Составь план тренировок на неделю"},
  {i:"code", t:"Показать код", d:"Пример на JavaScript", q:"Покажи пример кода на JavaScript"}];

let chats = [], cur = null, busy = false, stop = false, pend = [];
try { chats = JSON.parse(localStorage.getItem("nova-chats") || "[]"); } catch(e) { chats = []; }
const save = () => { try { localStorage.setItem("nova-chats", JSON.stringify(chats)); } catch(e) {} };
const thread = $("#thread"), sc = $("#scroll"), ta = $("#ta"), sendBtn = $("#send");
sendBtn.innerHTML = ic("up") + ic("stop");
let set = { fx: 0, hue: 0 };
try { Object.assign(set, JSON.parse(localStorage.getItem("nova-set") || "{}")); } catch(e) {}
const ACC = [[74,168,255],[160,125,255],[60,210,150],[255,120,175]];
function applySet(){
  document.documentElement.style.setProperty("--a", ACC[set.hue].join(","));
  try { localStorage.setItem("nova-set", JSON.stringify(set)); } catch(e) {}
  document.querySelectorAll("[data-fx],[data-hue]").forEach(b => b.classList.toggle("on", b.dataset.fx == set.fx || b.dataset.hue == set.hue));
  if(still || set.fx == 2) draw(0);
}

function copy(text, btn, label){
  const done = () => { btn.classList.add("ok"); setTimeout(() => btn.classList.remove("ok"), 1400); };
  const old = () => { const t = el("textarea"); t.value = text; document.body.append(t); t.select(); try { document.execCommand("copy"); done(); } catch(e) {} t.remove(); };
  try { navigator.clipboard.writeText(text).then(done, old); } catch(e) { old(); }
}
thread.addEventListener("click", e => { const c = e.target.closest(".cp"); if(c) copy(c.closest(".code").querySelector("pre").textContent, c); });
thread.addEventListener("pointermove", e => { const c = e.target.closest(".chip"); if(c){ const r = c.getBoundingClientRect(); c.style.setProperty("--mx", e.clientX - r.left + "px"); c.style.setProperty("--my", e.clientY - r.top + "px"); } });

function renderList(){
  const l = $("#list"), q = $("#q").value.trim().toLowerCase(); l.innerHTML = "";
  const arr = chats.filter(c => !q || (c.title + " " + c.messages.map(m => m.text).join(" ")).toLowerCase().includes(q)).sort((a,b) => !!b.pin - !!a.pin);
  if(!arr.length){ l.append(el("div","none", chats.length ? "Ничего не нашлось" : "Пока тихо. Начни первый разговор.")); return; }
  arr.forEach(c => {
    const row = el("div", "item" + (c === cur ? " on" : "") + (c.pin ? " pin" : ""));
    const t = el("button","t",c.title); t.type = "button"; t.onclick = () => open(c);
    const mk = (cls, icon, lab, fn) => { const b = el("button","s " + cls); b.innerHTML = ic(icon); b.type = "button"; b.setAttribute("aria-label",lab); b.title = lab; b.onclick = fn; return b; };
    const ed = mk("e","pencil","Переименовать", () => {
      const i = el("input"); i.value = c.title; t.replaceWith(i); i.focus(); i.select();
      i.onblur = () => { c.title = i.value.trim() || c.title; save(); renderList(); if(cur === c) $("#title").textContent = c.title; };
      i.onkeydown = e => { if(e.key === "Enter") i.blur(); if(e.key === "Escape"){ i.value = c.title; i.blur(); } };
    });
    const pn = mk("p","pin", c.pin ? "Открепить" : "Закрепить", () => { c.pin = !c.pin; save(); renderList(); });
    const x = mk("x","trash","Удалить чат", () => { chats = chats.filter(k => k !== c); if(cur === c) cur = null; save(); renderList(); renderThread(); });
    row.append(t, ed, pn, x); l.append(row);
  });
}
function hero(){
  const e = el("div","empty"); let n = 0;
  const hr = new Date().getHours(), g = hr < 5 ? "Доброй ночи" : hr < 12 ? "Доброе утро" : hr < 18 ? "Добрый день" : "Добрый вечер";
  const h = el("h2"); h.setAttribute("aria-label", g + ". Чем займёмся?");
  [g + ".", "Чем займёмся?"].forEach((line,li) => {
    const ln = el("span","ln" + (li ? " d" : "")); ln.setAttribute("aria-hidden","true");
    line.split(" ").forEach((w,wi,arr) => {
      const ws = el("span","w");
      [...w].forEach(ch => { const c = el("span","c",ch); c.style.setProperty("--i", n++); ws.append(c); });
      ln.append(ws); if(wi < arr.length-1) ln.append(" ");
    });
    h.append(ln);
  });
  e.append(av(), h, el("p","","Я Nova. Спрашивай, спорь, придумывай."));
  const ch = el("div","chips");
  SUGGEST.forEach((s,i) => {
    const b = el("button","chip"); b.type = "button"; b.style.setProperty("--i", i);
    b.innerHTML = ic(s.i) + "<b>" + s.t + "</b><span>" + s.d + "</span>";
    b.onclick = () => send(s.q); ch.append(b);
  });
  e.append(ch); return e;
}
function renderThread(){
  thread.classList.add("still"); thread.classList.remove("swap"); void thread.offsetWidth; thread.classList.add("swap");
  requestAnimationFrame(() => requestAnimationFrame(() => thread.classList.remove("still")));
  thread.innerHTML = "";
  $("#title").textContent = cur ? cur.title : "Новый чат";
  const has = !!(cur && cur.messages.length);
  calmT = has ? .55 : .3; lvlT = has ? (busy ? 1 : 0) : 1;
  if(!has){ thread.append(hero()); return; }
  cur.messages.forEach((m,i) => addMsg(m.role, m.text, i === cur.messages.length - 1, m));
  down(true);
}
function addMsg(role, text, last, msg){
  const m = el("div","m " + role), b = el("div","b");
  if(role === "me"){ b.textContent = text; if(msg && msg.files && msg.files.length) b.append(el("div","fc","📎 " + msg.files.join(", "))); m.append(b); }
  else {
    const col = el("div","col"); b.innerHTML = md(text); col.append(b);
    m.append(av(), col);
    if(text) acts(col, text, last, msg);
  }
  thread.append(m); down(); return m;
}
function acts(col, text, last, msg){
  const a = el("div","acts");
  const b = (icon, lab, fn, txt) => { const x = el("button"); x.type = "button"; x.innerHTML = ic(icon) + (txt || ""); x.setAttribute("aria-label", lab); x.title = lab; x.onclick = () => fn(x); a.append(x); return x; };
  b("copy","Копировать", x => { x.innerHTML = ic("copy") + ic("check"); copy(text, x); });
  if(msg) [["like","up","Полезно"],["dislike","down","Не то"]].forEach(([icn,k,lab]) => {
    const x = b(icn, lab, () => { msg.r = msg.r === k ? "" : k; save(); a.querySelectorAll("[data-k]").forEach(y => y.classList.toggle("on", msg.r === y.dataset.k)); });
    x.dataset.k = k; x.classList.toggle("on", msg.r === k);
  });
  if(last) b("rotate","Повторить", regen, "Повторить").classList.add("rg");
  col.append(a);
}
function addTyping(){
  const m = el("div","m ai"), d = av(); d.classList.add("live");
  m.append(d, el("div","think",["Nova думает…","Собираю мысли…","Подбираю слова…"][Math.random()*3|0])); thread.append(m); down(); return m;
}
function down(now){ sc.style.scrollBehavior = now ? "auto" : ""; sc.scrollTop = sc.scrollHeight; }
function open(c){ cur = c; document.body.classList.remove("nav"); renderList(); renderThread(); }
function newChat(){ cur = null; document.body.classList.remove("nav"); renderList(); renderThread(); ta.focus(); }
function setBusy(v){ busy = v; sendBtn.classList.toggle("busy", v); sendBtn.setAttribute("aria-label", v ? "Остановить" : "Отправить"); sendBtn.disabled = !v && !ta.value.trim() && !pend.length; }
function grow(){ ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight,160) + "px"; if(!busy) sendBtn.disabled = !ta.value.trim() && !pend.length; }

function send(text){
  text = (text || "").trim();
  if((!text && !pend.length) || busy) return;
  if(!cur){ cur = { id: Date.now(), title: (text || pend[0].name).slice(0,42), messages: [] }; chats.unshift(cur); }
  const files = pend; pend = []; drawAtt();
  cur.messages.push({ role:"me", text, files: files.map(f => f.name) }); save();
  ta.value = ""; grow(); renderList();
  if(cur.messages.length > 1){ thread.querySelectorAll(".rg").forEach(x => x.remove()); addMsg("me", text, false, cur.messages.at(-1)); } else renderThread();
  run(cur, files);
}
function regen(){
  if(busy || !cur) return;
  if(cur.messages.at(-1).role === "ai") cur.messages.pop();
  save(); renderThread(); run(cur);
}
async function run(chat, files = []){
  setBusy(true); stop = false; lvlT = 1;
  const r = sendBtn.getBoundingClientRect(); pulse(r.left + r.width/2, r.top + r.height/2);
  const typing = addTyping();
  let reply, bad = false;
  try { reply = await askAI(chat.messages, { files }); } catch(e) { bad = true; reply = "Не получилось получить ответ. Проверь соединение и попробуй ещё раз."; }
  typing.remove();
  if(bad){ tint = [255,95,110]; pulse(innerWidth/2, innerHeight/2); setTimeout(() => tint = null, 2600); }
  const m = addMsg("ai",""), b = m.querySelector(".b"), col = m.querySelector(".col");
  m.classList.add("live");
  let final = "";
  const show = () => { b.innerHTML = md(final); lvlT = typeof reply === "string" ? Math.max(0, 1 - final.length/reply.length) : Math.exp(-final.length/500); if(cur === chat) down(); };
  if(typeof reply === "string"){
    while(final.length < reply.length && !stop){ final = reply.slice(0, final.length + 2 + (Math.random()*3|0)); show(); await sleep(18); }
  } else {
    try { for await (const part of reply){ if(stop) break; final += part; show(); } } catch(e){ final += "\n\n(связь прервалась)"; show(); }
  }
  m.classList.remove("live"); show(); lvlT = 0;
  const msg = { role:"ai", text: final || "…" }; chat.messages.push(msg); save();
  if(cur === chat){ acts(col, msg.text, true, msg); down(); const a = col.getBoundingClientRect(); pulse(a.left, a.bottom); }
  setBusy(false);
}

$("#f").addEventListener("submit", e => { e.preventDefault(); if(busy){ stop = true; return; } send(ta.value); });
ta.addEventListener("input", grow);
ta.addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey && !matchMedia("(pointer:coarse)").matches){ e.preventDefault(); if(!busy) send(ta.value); }
});
$("#new").onclick = newChat; $("#plus").onclick = newChat;
$("#menu").onclick = () => document.body.classList.add("nav");
$("#scrim").onclick = () => document.body.classList.remove("nav");
addEventListener("keydown", e => {
  if(e.key === "Escape"){ document.body.classList.remove("nav"); $("#pop").classList.remove("on"); }
  else if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); document.body.classList.add("nav"); $("#q").focus(); }
  else if(e.key === "/" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)){ e.preventDefault(); ta.focus(); }
});

/* вложения */
function drawAtt(){
  const a = $("#att"); a.innerHTML = "";
  pend.forEach((f,i) => {
    const c = el("div","fc");
    if(f.type.startsWith("image/")){ const im = el("img"); im.src = URL.createObjectURL(f); im.alt = ""; c.append(im); }
    c.append(el("span","",f.name.length > 22 ? f.name.slice(0,20) + "…" : f.name));
    const x = el("button"); x.innerHTML = ic("x"); x.type = "button"; x.setAttribute("aria-label","Убрать файл"); x.onclick = () => { pend.splice(i,1); drawAtt(); };
    c.append(x); a.append(c);
  });
  grow();
}
$("#clip").onclick = () => $("#file").click();
$("#file").onchange = e => { pend.push(...e.target.files); e.target.value = ""; drawAtt(); };

/* голосовой ввод */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition, mic = $("#mic");
if(SR){
  mic.hidden = false; let rec = null;
  mic.onclick = () => {
    if(rec){ rec.stop(); return; }
    rec = new SR(); rec.lang = "ru-RU"; rec.interimResults = true;
    const base = ta.value ? ta.value + " " : "";
    rec.onresult = e => { ta.value = base + [...e.results].map(r => r[0].transcript).join(""); grow(); };
    rec.onend = rec.onerror = () => { rec = null; mic.classList.remove("rec"); };
    mic.classList.add("rec"); try { rec.start(); } catch(e) { rec = null; mic.classList.remove("rec"); }
  };
}

/* настройки, поиск, кнопка вниз */
$("#gear").onclick = e => { e.stopPropagation(); $("#pop").classList.toggle("on"); };
document.addEventListener("click", e => { if(!e.target.closest("#pop")) $("#pop").classList.remove("on"); });
document.querySelectorAll("[data-fx]").forEach(b => b.onclick = () => { set.fx = +b.dataset.fx; applySet(); });
document.querySelectorAll("[data-hue]").forEach(b => b.onclick = () => { set.hue = +b.dataset.hue; applySet(); });
$("#exp").onclick = e => { if(cur) copy(cur.messages.map(m => (m.role === "me" ? "Я: " : "Nova: ") + m.text).join("\n\n"), e.currentTarget); };
$("#clr").onclick = e => {
  const b = e.currentTarget;
  if(b.dataset.s){ chats = []; cur = null; save(); renderList(); renderThread(); b.textContent = "Удалить все чаты"; delete b.dataset.s; }
  else { b.dataset.s = 1; b.textContent = "Точно удалить всё?"; }
};
$("#q").oninput = renderList;
const fab = $("#fab");
sc.addEventListener("scroll", () => fab.classList.toggle("on", sc.scrollHeight - sc.scrollTop - sc.clientHeight > 240));
fab.onclick = () => { sc.style.scrollBehavior = ""; sc.scrollTop = sc.scrollHeight; };

/* клавиатура на телефоне: подгоняем высоту под видимую область */
if(window.visualViewport){
  const vv = () => {
    const kb = innerHeight - visualViewport.height - visualViewport.offsetTop > 80;
    document.documentElement.classList.toggle("kb", kb);
    document.documentElement.style.setProperty("--vh", visualViewport.height + "px");
    if(kb){ scrollTo(0,0); down(true); }
  };
  visualViewport.addEventListener("resize", vv);
}

/* ===== Фон: растр, который живёт вместе с чатом ===== */
const cv = $("#bg"), cx = cv.getContext("2d");
const still = matchMedia("(prefers-reduced-motion:reduce)").matches;
let W, H, cell, unit, colX, shape = [], t = 6, T = 0, en = 0, calm = .3, calmT = .3, px = -999, py = -999, pulses = [], tint = null, lvl = 1, lvlT = 1;
const sm = (v,a,b) => { v = (v-a)/(b-a); v = v < 0 ? 0 : v > 1 ? 1 : v; return v*v*(3-2*v); };
function fit(){
  const s = Math.min(devicePixelRatio || 1, W < 700 ? 1.25 : 1.5);
  W = innerWidth; H = innerHeight;
  cv.width = W*s; cv.height = H*s; cx.setTransform(s,0,0,s,0,0);
  cell = W < 700 ? 13 : 14; unit = W < 700 ? 56 : 68;
  colX = W > 820 ? (292 + W - 16)/2 : W/2;
  shape = []; for(let x = cell/2; x < W; x += cell) shape.push(1 - sm(Math.abs(x - colX), 400, 640));
  if(still) draw(0);
}
function pulse(x,y){ if(!still && set.fx != 1) pulses.push({x, y, t0: T}); }
function draw(dt){
  if(set.fx == 2){ cx.fillStyle = "#000"; cx.fillRect(0,0,W,H); return; }
  T += dt; t += dt*(.5 - calm*.22 + en*.9);
  en += ((busy ? 1 : 0) - en)*Math.min(1, dt*3);
  calm += (calmT - calm)*Math.min(1, dt*2.5);
  lvl += (lvlT - lvl)*Math.min(1, dt*2.2);
  if(lvl < .012){ cx.fillStyle = "#000"; cx.fillRect(0,0,W,H); return; }
  pulses = pulses.filter(p => T - p.t0 < 1.4);
  cx.fillStyle = "#000"; cx.fillRect(0,0,W,H);
  const blue = new Path2D(), white = new Path2D(), R2 = 130*130;
  for(let y = cell/2; y < H; y += cell){
    const v = y/unit, bot = 1 - .55*sm(y, H - 210, H - 50);
    let i = 0;
    for(let x = cell/2; x < W; x += cell, i++){
      const u = x/unit;
      const a = Math.sin(u*1.1 + t*.45) + Math.sin(v*1.25 - t*.38) + Math.sin((u+v)*.9 + t*.3)
              + Math.sin(Math.hypot(u-8, v-5)*1.4 - t*.5) + .6*Math.sin(u*2.3 + v*1.1 + t*.7);
      let f = (a + 4.6)/9.2 + en*.07;
      f = (f - .52)/.38;
      const dx = x - px, dy = y - py, d2 = dx*dx + dy*dy;
      if(d2 < R2 && !set.fx) f += (1 - d2/R2)*.55*(1 - calm*shape[i]);
      for(const p of pulses){
        const age = T - p.t0, w = Math.hypot(x - p.x, y - p.y) - age*560;
        f += Math.exp(-w*w/2200)*(1 - age/1.4)*.8;
      }
      f = f < 0 ? 0 : f > 1 ? 1 : f; f = f*f*(3 - 2*f);
      f *= (1 - calm*.93*shape[i])*bot*(set.fx == 1 ? .3 : 1)*lvl;
      const r = f*cell*.58;
      if(r < .7) continue;
      blue.moveTo(x + r, y); blue.arc(x, y, r, 0, 6.2832);
      if(f > .55){ const w = r*(f - .35); white.moveTo(x + w, y); white.arc(x, y, w, 0, 6.2832); }
    }
  }
  cx.fillStyle = "rgb(" + (tint || ACC[set.hue]).join(",") + ")"; cx.fill(blue);
  cx.fillStyle = "#e6f3ff"; cx.fill(white);
}
let last = 0;
function loop(now){
  requestAnimationFrame(loop);
  if(now - last < 33) return;
  draw(Math.min((now - last)/1000, .1)); last = now;
}
addEventListener("resize", fit); fit();
if(!still){
  addEventListener("pointermove", e => { px = e.clientX; py = e.clientY; });
  addEventListener("pointerup", e => { if(e.pointerType !== "mouse") setTimeout(() => { px = -999; }, 400); });
  document.addEventListener("pointerleave", () => { px = -999; });
  requestAnimationFrame(loop);
}
$("#bav").innerHTML = logo();
applySet(); renderList(); renderThread();
</script>
