<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nova — ИИ-чат</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --a:74,168,255;--ink:#eaf4ff;--dim:#8fa6bf;--blue:rgb(var(--a));--ice:color-mix(in srgb,var(--blue) 22%,#fff);--line:rgba(var(--a),.24);
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-head:"Unbounded","Onest",system-ui,sans-serif;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root.kb{padding-bottom:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:#000;color:var(--ink);font:400 16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.app{position:relative;z-index:1;height:100%;display:flex;gap:16px;padding:16px}
.kb .app{height:calc(var(--vh) - env(safe-area-inset-top,0px))}

/* sidebar */
.side{width:260px;flex:none;display:flex;flex-direction:column;padding:18px 12px;gap:14px;min-height:0;background:rgba(3,7,13,.55);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border:1px solid var(--line);border-radius:28px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px;font:700 17px var(--f-head)}
.dot{width:30px;height:30px;border-radius:50%;flex:none;background:radial-gradient(circle at 34% 30%,#fff 0,color-mix(in srgb,var(--blue) 40%,#fff) 18%,var(--blue) 52%,color-mix(in srgb,var(--blue) 35%,#000) 100%);box-shadow:0 0 18px rgba(var(--a),.45),inset 0 -4px 8px rgba(0,20,60,.5)}
.dot.live,.m.live>.dot{animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.12);box-shadow:0 0 32px rgba(var(--a),.85),inset 0 -4px 8px rgba(0,20,60,.5)}}

.new{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:rgba(var(--a),.1);font-weight:500;transition:background .2s,transform .15s}
.new:hover{background:rgba(var(--a),.22)}.new:active{transform:scale(.97)}
.list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;min-height:0}
.item{display:flex;align-items:center;border-radius:14px;padding:0 4px 0 12px;transition:background .2s}
.item:hover,.item.on{background:rgba(var(--a),.14)}
.item.on{box-shadow:inset 2px 0 0 var(--blue)}
.item .t{flex:1;text-align:left;padding:10px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ice);font-size:15px}
.item .x{width:32px;height:32px;border-radius:10px;color:var(--dim);font-size:18px;line-height:1}
.item .x:hover{color:#fff;background:rgba(255,255,255,.1)}
.none{color:var(--dim);font-size:14px;padding:6px 12px}
.scrim{display:none}

/* chat: без панели, текст лежит прямо на растре */
.chat{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;position:relative}
header{display:flex;align-items:center;gap:8px;padding:4px 4px 8px;min-height:52px}
header h1{flex:1;margin:0;font:500 15px var(--f-body);color:var(--ice);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 0 14px #000}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--ice);background:rgba(3,7,13,.5);border:1px solid var(--line)}
.menu,.plus{display:none}
#scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;scroll-behavior:smooth;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 24px,#000 calc(100% - 16px),transparent);mask-image:linear-gradient(to bottom,transparent,#000 24px,#000 calc(100% - 16px),transparent)}
#thread{max-width:780px;margin:0 auto;padding:24px 18px 12px;display:flex;flex-direction:column;gap:22px;min-height:100%;text-shadow:0 0 6px #000,0 0 18px #000}

.empty{margin:auto;text-align:center;padding:24px 0}
.empty h2{margin:20px 0 12px;font:700 clamp(32px,8vw,60px)/1.08 var(--f-head);letter-spacing:-.025em}
.w{display:inline-block;white-space:nowrap}
.c{display:inline-block;animation:rise .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*45ms + 150ms)}
@keyframes rise{from{opacity:0;filter:blur(12px);transform:translateY(22px) scale(.9)}}
.empty p{margin:0 auto 28px;color:#b3c8de;max-width:30ch;animation:rise .8s .9s cubic-bezier(.2,.8,.2,1) both}
.empty .dot{width:68px;height:68px;margin:0 auto;box-shadow:0 0 50px rgba(var(--a),.6),inset 0 -8px 14px rgba(0,20,60,.5);animation:rise .8s both,breathe 4s 1s ease-in-out infinite}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:560px;margin:0 auto}
.chip{padding:14px 16px;border-radius:18px;border:1px solid var(--line);background:rgba(3,9,18,.68);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--ice);font-size:14.5px;text-align:left;transition:border-color .2s,background .2s,transform .2s;animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(1.1s + var(--i)*90ms)}
.chip:hover{border-color:var(--blue);background:rgba(var(--a),.2);transform:translateY(-2px)}

.m{display:flex;gap:12px;align-items:flex-start;animation:in .4s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.m.me{justify-content:flex-end}
.m.me .b{max-width:84%;padding:11px 16px;border-radius:22px 22px 6px 22px;background:rgba(var(--a),.16);border:1px solid rgba(var(--a),.55);color:var(--ice);white-space:pre-wrap;overflow-wrap:anywhere;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);text-shadow:none}
.col{min-width:0;flex:1;max-width:68ch;font-size:16.5px;line-height:1.7;color:#e9f3ff}
.b .tx{white-space:pre-wrap;overflow-wrap:anywhere}
.b .tx:empty{display:none}
.b .tx+.code,.b .code+.tx,.b .code+.code{margin-top:10px}
.b code{font:500 .9em ui-monospace,Menlo,Consolas,monospace;background:rgba(var(--a),.18);padding:1px 6px;border-radius:6px}
.code{position:relative;border:1px solid var(--line);border-radius:16px;background:rgba(2,6,12,.85);text-shadow:none}
.code pre{margin:0;padding:16px;overflow-x:auto;font:400 13.5px/1.55 ui-monospace,Menlo,Consolas,monospace;color:#d6ebff}
.cp{position:absolute;top:8px;right:8px;padding:4px 10px;border-radius:999px;font-size:12px;color:var(--ice);background:rgba(var(--a),.16)}
.cp:hover{background:rgba(var(--a),.3)}
.live .b .tx:last-child::after{content:"";display:inline-block;width:8px;height:1.05em;margin-left:3px;vertical-align:-2px;border-radius:2px;background:var(--blue);box-shadow:0 0 12px var(--blue);animation:bl .9s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.think{padding-top:3px;background:linear-gradient(90deg,#5a7391 30%,#fff 50%,#5a7391 70%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none;animation:shim 1.6s linear infinite}
@keyframes shim{to{background-position:-250% 0}}
.acts{display:flex;gap:4px;margin-top:6px;opacity:0;transition:opacity .2s}
.m:hover .acts,.m:focus-within .acts{opacity:1}
.acts button{padding:4px 10px;border-radius:999px;font-size:13px;color:var(--dim);text-shadow:none}
.acts button:hover{color:#fff;background:rgba(255,255,255,.1)}

/* composer */
form{padding:6px 0 4px}
.box{max-width:780px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;padding:8px;border-radius:28px;background:rgba(5,12,22,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);transition:border-color .25s,box-shadow .25s}
.box:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px rgba(var(--a),.14),0 0 50px rgba(var(--a),.25)}
textarea{flex:1;resize:none;border:0;outline:0;background:none;color:var(--ink);font:400 16px/1.5 var(--f-body);padding:9px 4px;max-height:160px;min-width:0}
textarea::placeholder{color:#6d849d}
.send{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;background:#fff;color:#031020;transition:transform .2s,background .2s,box-shadow .3s}
.send:hover{background:var(--ice)}.send:active{transform:scale(.9)}
.send:disabled{background:rgba(255,255,255,.12);color:#6d849d;cursor:default}
.send:not(:disabled){box-shadow:0 0 24px rgba(var(--a),.55)}
.send.busy{animation:ring 1.2s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(var(--a),.7)}100%{box-shadow:0 0 0 16px rgba(var(--a),0)}}
.hint{text-align:center;color:#587089;font-size:12.5px;margin-top:6px;text-shadow:0 0 8px #000}


.search{width:100%;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--ink);font:400 14px var(--f-body);outline:0}
.search:focus{border-color:var(--blue)}
.item .s{width:28px;height:28px;border-radius:8px;color:var(--dim);font-size:14px;opacity:0;transition:opacity .2s}
.item:hover .s,.item:focus-within .s,.item.pin .s.p{opacity:1}
.item.pin .p{color:var(--blue)}
.item input{flex:1;min-width:0;background:rgba(0,0,0,.4);border:1px solid var(--blue);border-radius:8px;color:var(--ink);font:inherit;font-size:15px;padding:6px 8px;margin:4px 0;outline:0}
.pop{position:absolute;right:4px;top:54px;z-index:10;width:270px;padding:16px;border-radius:20px;background:rgba(4,9,16,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);display:none;flex-direction:column;gap:14px}
.pop.on{display:flex;animation:in .25s}
.pop h3{margin:0 0 6px;font:500 13px var(--f-body);color:var(--dim)}
.seg{display:flex;gap:4px;padding:3px;border-radius:12px;background:rgba(255,255,255,.06)}
.seg button{flex:1;padding:7px 0;border-radius:9px;font-size:13.5px;color:var(--dim)}
.seg button.on{background:rgba(var(--a),.3);color:#fff}
.sws{display:flex;gap:10px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 2px rgba(0,0,0,.5)}
.sw.on{border-color:#fff}
.pop .act{padding:9px 12px;border-radius:12px;text-align:left;font-size:14px;background:rgba(255,255,255,.06)}
.pop .act:hover{background:rgba(255,255,255,.12)}
.ch{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 6px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--dim)}
.ch .cp{position:static}
.k{color:#ff9ac1}.s2{color:#9be3b0}.n{color:#ffcf8a}.cm{color:#6d849d}
.fab{position:absolute;right:8px;bottom:118px;width:40px;height:40px;border-radius:50%;display:none;place-items:center;background:rgba(5,12,22,.88);border:1px solid var(--line);color:var(--ice);z-index:5}
.fab.on{display:grid;animation:in .25s}
.att{display:flex;gap:8px;flex-wrap:wrap;max-width:780px;margin:0 auto 8px}
.att:empty{display:none}
.fc{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:12px;background:rgba(5,12,22,.8);border:1px solid var(--line);font-size:13px;color:var(--ice);text-shadow:none}
.b .fc{margin-top:8px}
.fc img{width:28px;height:28px;border-radius:7px;object-fit:cover}
.fc button{width:22px;height:22px;border-radius:50%;color:var(--dim)}
.tb{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--dim);transition:color .2s,background .2s}
.tb[hidden]{display:none}
.tb:hover{color:#fff;background:rgba(255,255,255,.08)}
.tb.rec{color:#ff6b7d;animation:ring 1.2s infinite}
.acts .on{color:var(--blue)}
@media (hover:none){.item .s,.acts{opacity:.75}}
@media (max-width:820px){
  .app{padding:0 10px 6px;gap:0}
  .menu,.plus{display:grid}
  .side{position:fixed;z-index:20;left:0;top:0;bottom:0;width:min(320px,86vw);border-radius:0 28px 28px 0;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-102%);transition:transform .32s cubic-bezier(.3,.8,.3,1);background:rgba(3,7,13,.92)}
  .scrim{display:block;position:fixed;inset:0;z-index:19;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .3s}
  body.nav .side{transform:none}
  body.nav .scrim{opacity:1;pointer-events:auto}
  #thread{padding:16px 4px 8px}
  .chips{grid-template-columns:1fr}
  .m.me .b{max-width:90%}
  .acts{opacity:.7}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="app">
  <aside class="side" id="side" aria-label="Чаты">
    <div class="brand"><span class="dot"></span>Nova</div>
    <button class="new" id="new" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Новый чат
    </button>
    <input class="search" id="q" placeholder="Поиск по чатам" aria-label="Поиск по чатам" autocomplete="off">
    <div class="list" id="list"></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="chat">
    <header>
      <button class="ib menu" id="menu" type="button" aria-label="Открыть чаты">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      </button>
      <h1 id="title">Новый чат</h1>
      <button class="ib plus" id="plus" type="button" aria-label="Новый чат">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="ib" id="gear" type="button" aria-label="Настройки">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      </button>
    </header>
    <div class="pop" id="pop">
      <div><h3>Фон</h3><div class="seg"><button type="button" data-fx="0">Живой</button><button type="button" data-fx="1">Спокойный</button><button type="button" data-fx="2">Выкл</button></div></div>
      <div><h3>Цвет</h3><div class="sws"><button class="sw" type="button" data-hue="0" aria-label="Синий" style="background:#4aa8ff"></button><button class="sw" type="button" data-hue="1" aria-label="Фиолетовый" style="background:#a07dff"></button><button class="sw" type="button" data-hue="2" aria-label="Зелёный" style="background:#3cd296"></button><button class="sw" type="button" data-hue="3" aria-label="Розовый" style="background:#ff78af"></button></div></div>
      <button class="act" id="exp" type="button">Скопировать переписку</button>
      <button class="act" id="clr" type="button">Удалить все чаты</button>
    </div>
    <div id="scroll"><div id="thread" aria-live="polite"></div></div>
    <form id="f" autocomplete="off">
      <div class="att" id="att"></div>
      <div class="box">
        <button class="tb" id="clip" type="button" aria-label="Прикрепить файл"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11l-8.5 8.5a5 5 0 01-7-7L14 4a3.5 3.5 0 015 5l-8.5 8.5a2 2 0 01-3-3L15 7"/></svg></button><input type="file" id="file" multiple hidden>
        <textarea id="ta" rows="1" placeholder="Что у тебя на уме?" aria-label="Сообщение"></textarea>
        <button class="tb" id="mic" type="button" aria-label="Голосовой ввод" hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button>
        <button class="send" id="send" type="submit" aria-label="Отправить" disabled></button>
      </div>
      <div class="hint">Enter — отправить · Shift+Enter — перенос · / — в поле ввода · Ctrl+K — поиск</div>
    </form>
    <button class="fab" id="fab" type="button" aria-label="Вниз"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg></button>
  </main>
</div>

<script>
/* ===== ИИ: сейчас имитация. Замени тело askAI на свой запрос =====
   history — массив {role:'me'|'ai', text, files:[имена]}; ctx.files — прикреплённые File.
   Верни строку целиком ИЛИ async-генератор с кусочками текста (настоящий стриминг):
   async function* askAI(history, ctx){ const r = await fetch('/api/chat', {method:'POST', body: JSON.stringify({history})});
     const rd = r.body.getReader(), dec = new TextDecoder(); for(;;){ const {done, value} = await rd.read(); if(done) return; yield dec.decode(value, {stream:true}); } } */
async function askAI(history, ctx){
  await sleep(900 + Math.random()*800);
  const q = history[history.length-1].text.toLowerCase();
  if(/привет|здравств|хай/.test(q)) return "Привет! Я **Nova**. Пока я демо-версия, но уже умею красиво отвечать. О чём поговорим?";
  if(/код|js|python|скрипт/.test(q)) return "Держи пример на JavaScript:\n```js\nasync function askAI(history) {\n  const r = await fetch('/api/chat', {\n    method: 'POST',\n    body: JSON.stringify({ history })\n  });\n  return (await r.json()).text;\n}\n```\nВставь свой адрес вместо `/api/chat`, и всё заработает.";
  if(/назван|придума/.test(q)) return "Вот несколько вариантов:\n\n• **Орбита**\n• **Полутон**\n• **Сигнал**\n• **Растр**\n\nМогу подобрать ещё, если расскажешь, о чём проект.";
  if(/план|тренир/.test(q)) return "План на неделю:\n\nПн — ноги и кор\nВт — отдых или прогулка\nСр — спина и плечи\nЧт — кардио 30 минут\nПт — грудь и руки\nСб — длинная прогулка\nВс — отдых";
  return "Это демо-ответ. Настоящая модель подключается в функции `askAI()` в начале скрипта: достаточно вернуть из неё текст.";
}
/* ================================================================ */

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const el = (t, c, x) => { const e = document.createElement(t); if(c) e.className = c; if(x != null) e.textContent = x; return e; };
const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function hl(c){
  return esc(c).replace(/(\/\/[^\n]*)|('(?:[^'\\\n]|\\.)*'|"(?:[^"\\\n]|\\.)*"|`[^`]*`)|\b(const|let|var|function|async|await|return|if|else|for|while|import|from|export|class|new|def|try|catch|throw|true|false|null|None)\b|\b(\d+\.?\d*)\b/g,
    (m,a,b,k) => '<span class="' + (a ? "cm" : b ? "s2" : k ? "k" : "n") + '">' + m + "</span>");
}
function md(s){
  return s.split("```").map((p,i) => i % 2
    ? '<div class="code"><div class="ch"><span>' + esc(p.match(/^[^\n]*/)[0].trim() || "код") + '</span><button type="button" class="cp">Копировать</button></div><pre>' + hl(p.replace(/^[^\n]*\n/,"")) + "</pre></div>"
    : '<div class="tx">' + esc(p.trim()).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`\n]+)`/g,"<code>$1</code>") + "</div>").join("");
}
const SEND = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
const STOP = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="3"/></svg>';
const SUGGEST = ["Придумай название для проекта","Объясни, как работает нейросеть","Составь план тренировок на неделю","Покажи пример кода на JavaScript"];

let chats = [], cur = null, busy = false, stop = false, pend = [];
try { chats = JSON.parse(localStorage.getItem("nova-chats") || "[]"); } catch(e) { chats = []; }
const save = () => { try { localStorage.setItem("nova-chats", JSON.stringify(chats)); } catch(e) {} };
const thread = $("#thread"), sc = $("#scroll"), ta = $("#ta"), sendBtn = $("#send");
sendBtn.innerHTML = SEND;
let set = { fx: 0, hue: 0 };
try { Object.assign(set, JSON.parse(localStorage.getItem("nova-set") || "{}")); } catch(e) {}
const ACC = [[74,168,255],[160,125,255],[60,210,150],[255,120,175]];
function applySet(){
  document.documentElement.style.setProperty("--a", ACC[set.hue].join(","));
  try { localStorage.setItem("nova-set", JSON.stringify(set)); } catch(e) {}
  document.querySelectorAll("[data-fx],[data-hue]").forEach(b => b.classList.toggle("on", b.dataset.fx == set.fx || b.dataset.hue == set.hue));
  if(still || set.fx == 2) draw(0);
}

function copy(text, btn, label){
  const done = () => { const o = btn.textContent; btn.textContent = "Скопировано"; setTimeout(() => btn.textContent = o, 1300); };
  const old = () => { const t = el("textarea"); t.value = text; document.body.append(t); t.select(); try { document.execCommand("copy"); done(); } catch(e) {} t.remove(); };
  try { navigator.clipboard.writeText(text).then(done, old); } catch(e) { old(); }
}
thread.addEventListener("click", e => { if(e.target.classList.contains("cp")) copy(e.target.closest(".code").querySelector("pre").textContent, e.target); });

function renderList(){
  const l = $("#list"), q = $("#q").value.trim().toLowerCase(); l.innerHTML = "";
  const arr = chats.filter(c => !q || (c.title + " " + c.messages.map(m => m.text).join(" ")).toLowerCase().includes(q)).sort((a,b) => !!b.pin - !!a.pin);
  if(!arr.length){ l.append(el("div","none", chats.length ? "Ничего не нашлось" : "Пока тихо. Начни первый разговор.")); return; }
  arr.forEach(c => {
    const row = el("div", "item" + (c === cur ? " on" : "") + (c.pin ? " pin" : ""));
    const t = el("button","t",c.title); t.type = "button"; t.onclick = () => open(c);
    const mk = (cls, txt, lab, fn) => { const b = el("button","s " + cls,txt); b.type = "button"; b.setAttribute("aria-label",lab); b.onclick = fn; return b; };
    const ed = mk("e","✎","Переименовать", () => {
      const i = el("input"); i.value = c.title; t.replaceWith(i); i.focus(); i.select();
      i.onblur = () => { c.title = i.value.trim() || c.title; save(); renderList(); if(cur === c) $("#title").textContent = c.title; };
      i.onkeydown = e => { if(e.key === "Enter") i.blur(); if(e.key === "Escape"){ i.value = c.title; i.blur(); } };
    });
    const pn = mk("p", c.pin ? "★" : "☆", "Закрепить", () => { c.pin = !c.pin; save(); renderList(); });
    const x = mk("x","×","Удалить чат", () => { chats = chats.filter(k => k !== c); if(cur === c) cur = null; save(); renderList(); renderThread(); });
    row.append(t, ed, pn, x); l.append(row);
  });
}
function hero(){
  const e = el("div","empty"); let n = 0;
  const h = el("h2"); h.setAttribute("aria-label","Привет. Я Nova.");
  "Привет. Я Nova.".split(" ").forEach((w,wi,arr) => {
    const ws = el("span","w"); ws.setAttribute("aria-hidden","true");
    [...w].forEach(ch => { const c = el("span","c",ch); c.style.setProperty("--i", n++); ws.append(c); });
    h.append(ws); if(wi < arr.length-1) h.append(" ");
  });
  e.append(el("div","dot"), h, el("p","","Спрашивай, спорь, придумывай. Я рядом."));
  const ch = el("div","chips");
  SUGGEST.forEach((s,i) => { const b = el("button","chip",s); b.type = "button"; b.style.setProperty("--i", i); b.onclick = () => send(s); ch.append(b); });
  e.append(ch); return e;
}
function renderThread(){
  thread.innerHTML = "";
  $("#title").textContent = cur ? cur.title : "Новый чат";
  const has = !!(cur && cur.messages.length);
  calmT = has ? 1 : .3;
  if(!has){ thread.append(hero()); return; }
  cur.messages.forEach((m,i) => addMsg(m.role, m.text, i === cur.messages.length - 1, m));
  down(true);
}
function addMsg(role, text, last, msg){
  const m = el("div","m " + role), b = el("div","b");
  if(role === "me"){ b.textContent = text; if(msg && msg.files && msg.files.length) b.append(el("div","fc","📎 " + msg.files.join(", "))); m.append(b); }
  else {
    const col = el("div","col"); b.innerHTML = md(text); col.append(b);
    m.append(el("span","dot"), col);
    if(text) acts(col, text, last, msg);
  }
  thread.append(m); down(); return m;
}
function acts(col, text, last, msg){
  const a = el("div","acts"), b = (t, fn) => { const x = el("button","",t); x.type = "button"; x.onclick = () => fn(x); a.append(x); return x; };
  b("Копировать", x => copy(text, x));
  if(msg) [["👍","up"],["👎","down"]].forEach(([e,k]) => {
    const x = b(e, () => { msg.r = msg.r === k ? "" : k; save(); a.querySelectorAll("[data-k]").forEach(y => y.classList.toggle("on", msg.r === y.dataset.k)); });
    x.dataset.k = k; x.classList.toggle("on", msg.r === k);
  });
  if(last) b("Повторить", regen);
  col.append(a);
}
function addTyping(){
  const m = el("div","m ai"), d = el("span","dot live");
  m.append(d, el("div","think",["Nova думает…","Собираю мысли…","Подбираю слова…"][Math.random()*3|0])); thread.append(m); down(); return m;
}
function down(now){ sc.style.scrollBehavior = now ? "auto" : ""; sc.scrollTop = sc.scrollHeight; }
function open(c){ cur = c; document.body.classList.remove("nav"); renderList(); renderThread(); }
function newChat(){ cur = null; document.body.classList.remove("nav"); renderList(); renderThread(); ta.focus(); }
function setBusy(v){ busy = v; sendBtn.classList.toggle("busy", v); sendBtn.innerHTML = v ? STOP : SEND; sendBtn.setAttribute("aria-label", v ? "Остановить" : "Отправить"); sendBtn.disabled = !v && !ta.value.trim() && !pend.length; }
function grow(){ ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight,160) + "px"; if(!busy) sendBtn.disabled = !ta.value.trim() && !pend.length; }

function send(text){
  text = (text || "").trim();
  if((!text && !pend.length) || busy) return;
  if(!cur){ cur = { id: Date.now(), title: (text || pend[0].name).slice(0,42), messages: [] }; chats.unshift(cur); }
  const files = pend; pend = []; drawAtt();
  cur.messages.push({ role:"me", text, files: files.map(f => f.name) }); save();
  ta.value = ""; grow(); renderList(); renderThread();
  run(cur, files);
}
function regen(){
  if(busy || !cur) return;
  if(cur.messages.at(-1).role === "ai") cur.messages.pop();
  save(); renderThread(); run(cur);
}
async function run(chat, files = []){
  setBusy(true); stop = false;
  const r = sendBtn.getBoundingClientRect(); pulse(r.left + r.width/2, r.top + r.height/2);
  const typing = addTyping();
  let reply, bad = false;
  try { reply = await askAI(chat.messages, { files }); } catch(e) { bad = true; reply = "Не получилось получить ответ. Проверь соединение и попробуй ещё раз."; }
  typing.remove();
  if(bad){ tint = [255,95,110]; pulse(innerWidth/2, innerHeight/2); setTimeout(() => tint = null, 2600); }
  const m = addMsg("ai",""), b = m.querySelector(".b"), col = m.querySelector(".col");
  m.classList.add("live");
  let final = "";
  const show = () => { b.innerHTML = md(final); if(cur === chat) down(); };
  if(typeof reply === "string"){
    while(final.length < reply.length && !stop){ final = reply.slice(0, final.length + 2 + (Math.random()*3|0)); show(); await sleep(18); }
  } else {
    try { for await (const part of reply){ if(stop) break; final += part; show(); } } catch(e){ final += "\n\n(связь прервалась)"; show(); }
  }
  m.classList.remove("live"); show();
  const msg = { role:"ai", text: final || "…" }; chat.messages.push(msg); save();
  if(cur === chat){ acts(col, msg.text, true, msg); down(); const a = col.getBoundingClientRect(); pulse(a.left, a.bottom); }
  setBusy(false);
}

$("#f").addEventListener("submit", e => { e.preventDefault(); if(busy){ stop = true; return; } send(ta.value); });
ta.addEventListener("input", grow);
ta.addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey && !matchMedia("(pointer:coarse)").matches){ e.preventDefault(); if(!busy) send(ta.value); }
});
$("#new").onclick = newChat; $("#plus").onclick = newChat;
$("#menu").onclick = () => document.body.classList.add("nav");
$("#scrim").onclick = () => document.body.classList.remove("nav");
addEventListener("keydown", e => {
  if(e.key === "Escape"){ document.body.classList.remove("nav"); $("#pop").classList.remove("on"); }
  else if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); document.body.classList.add("nav"); $("#q").focus(); }
  else if(e.key === "/" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)){ e.preventDefault(); ta.focus(); }
});

/* вложения */
function drawAtt(){
  const a = $("#att"); a.innerHTML = "";
  pend.forEach((f,i) => {
    const c = el("div","fc");
    if(f.type.startsWith("image/")){ const im = el("img"); im.src = URL.createObjectURL(f); im.alt = ""; c.append(im); }
    c.append(el("span","",f.name.length > 22 ? f.name.slice(0,20) + "…" : f.name));
    const x = el("button","","×"); x.type = "button"; x.setAttribute("aria-label","Убрать файл"); x.onclick = () => { pend.splice(i,1); drawAtt(); };
    c.append(x); a.append(c);
  });
  grow();
}
$("#clip").onclick = () => $("#file").click();
$("#file").onchange = e => { pend.push(...e.target.files); e.target.value = ""; drawAtt(); };

/* голосовой ввод */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition, mic = $("#mic");
if(SR){
  mic.hidden = false; let rec = null;
  mic.onclick = () => {
    if(rec){ rec.stop(); return; }
    rec = new SR(); rec.lang = "ru-RU"; rec.interimResults = true;
    const base = ta.value ? ta.value + " " : "";
    rec.onresult = e => { ta.value = base + [...e.results].map(r => r[0].transcript).join(""); grow(); };
    rec.onend = rec.onerror = () => { rec = null; mic.classList.remove("rec"); };
    mic.classList.add("rec"); try { rec.start(); } catch(e) { rec = null; mic.classList.remove("rec"); }
  };
}

/* настройки, поиск, кнопка вниз */
$("#gear").onclick = e => { e.stopPropagation(); $("#pop").classList.toggle("on"); };
document.addEventListener("click", e => { if(!e.target.closest("#pop")) $("#pop").classList.remove("on"); });
document.querySelectorAll("[data-fx]").forEach(b => b.onclick = () => { set.fx = +b.dataset.fx; applySet(); });
document.querySelectorAll("[data-hue]").forEach(b => b.onclick = () => { set.hue = +b.dataset.hue; applySet(); });
$("#exp").onclick = e => { if(cur) copy(cur.messages.map(m => (m.role === "me" ? "Я: " : "Nova: ") + m.text).join("\n\n"), e.target); };
$("#clr").onclick = e => {
  const b = e.target;
  if(b.dataset.s){ chats = []; cur = null; save(); renderList(); renderThread(); b.textContent = "Удалить все чаты"; delete b.dataset.s; }
  else { b.dataset.s = 1; b.textContent = "Точно удалить всё?"; }
};
$("#q").oninput = renderList;
const fab = $("#fab");
sc.addEventListener("scroll", () => fab.classList.toggle("on", sc.scrollHeight - sc.scrollTop - sc.clientHeight > 240));
fab.onclick = () => { sc.style.scrollBehavior = ""; sc.scrollTop = sc.scrollHeight; };

/* клавиатура на телефоне: подгоняем высоту под видимую область */
if(window.visualViewport){
  const vv = () => {
    const kb = innerHeight - visualViewport.height - visualViewport.offsetTop > 80;
    document.documentElement.classList.toggle("kb", kb);
    document.documentElement.style.setProperty("--vh", visualViewport.height + "px");
    if(kb){ scrollTo(0,0); down(true); }
  };
  visualViewport.addEventListener("resize", vv);
}

/* ===== Фон: растр, который живёт вместе с чатом ===== */
const cv = $("#bg"), cx = cv.getContext("2d");
const still = matchMedia("(prefers-reduced-motion:reduce)").matches;
let W, H, cell, unit, colX, shape = [], t = 6, T = 0, en = 0, calm = .3, calmT = .3, px = -999, py = -999, pulses = [], tint = null;
const sm = (v,a,b) => { v = (v-a)/(b-a); v = v < 0 ? 0 : v > 1 ? 1 : v; return v*v*(3-2*v); };
function fit(){
  const s = Math.min(devicePixelRatio || 1, W < 700 ? 1.25 : 1.5);
  W = innerWidth; H = innerHeight;
  cv.width = W*s; cv.height = H*s; cx.setTransform(s,0,0,s,0,0);
  cell = W < 700 ? 13 : 14; unit = W < 700 ? 56 : 68;
  colX = W > 820 ? (292 + W - 16)/2 : W/2;
  shape = []; for(let x = cell/2; x < W; x += cell) shape.push(1 - sm(Math.abs(x - colX), 400, 640));
  if(still) draw(0);
}
function pulse(x,y){ if(!still && set.fx != 1) pulses.push({x, y, t0: T}); }
function draw(dt){
  if(set.fx == 2){ cx.fillStyle = "#000"; cx.fillRect(0,0,W,H); return; }
  T += dt; t += dt*(.5 - calm*.22 + en*.9);
  en += ((busy ? 1 : 0) - en)*Math.min(1, dt*3);
  calm += (calmT - calm)*Math.min(1, dt*2.5);
  pulses = pulses.filter(p => T - p.t0 < 1.4);
  cx.fillStyle = "#000"; cx.fillRect(0,0,W,H);
  const blue = new Path2D(), white = new Path2D(), R2 = 130*130;
  for(let y = cell/2; y < H; y += cell){
    const v = y/unit, bot = 1 - .55*sm(y, H - 210, H - 50);
    let i = 0;
    for(let x = cell/2; x < W; x += cell, i++){
      const u = x/unit;
      const a = Math.sin(u*1.1 + t*.45) + Math.sin(v*1.25 - t*.38) + Math.sin((u+v)*.9 + t*.3)
              + Math.sin(Math.hypot(u-8, v-5)*1.4 - t*.5) + .6*Math.sin(u*2.3 + v*1.1 + t*.7);
      let f = (a + 4.6)/9.2 + en*.07;
      f = (f - .52)/.38;
      const dx = x - px, dy = y - py, d2 = dx*dx + dy*dy;
      if(d2 < R2 && !set.fx) f += (1 - d2/R2)*.55*(1 - calm*shape[i]);
      for(const p of pulses){
        const age = T - p.t0, w = Math.hypot(x - p.x, y - p.y) - age*560;
        f += Math.exp(-w*w/2200)*(1 - age/1.4)*.8;
      }
      f = f < 0 ? 0 : f > 1 ? 1 : f; f = f*f*(3 - 2*f);
      f *= (1 - calm*.93*shape[i])*bot*(set.fx == 1 ? .3 : 1);
      const r = f*cell*.58;
      if(r < .7) continue;
      blue.moveTo(x + r, y); blue.arc(x, y, r, 0, 6.2832);
      if(f > .55){ const w = r*(f - .35); white.moveTo(x + w, y); white.arc(x, y, w, 0, 6.2832); }
    }
  }
  cx.fillStyle = "rgb(" + (tint || ACC[set.hue]).join(",") + ")"; cx.fill(blue);
  cx.fillStyle = "#e6f3ff"; cx.fill(white);
}
let last = 0;
function loop(now){
  requestAnimationFrame(loop);
  if(now - last < 33) return;
  draw(Math.min((now - last)/1000, .1)); last = now;
}
addEventListener("resize", fit); fit();
if(!still){
  addEventListener("pointermove", e => { px = e.clientX; py = e.clientY; });
  addEventListener("pointerup", e => { if(e.pointerType !== "mouse") setTimeout(() => { px = -999; }, 400); });
  document.addEventListener("pointerleave", () => { px = -999; });
  requestAnimationFrame(loop);
}
applySet(); renderList(); renderThread();
</script>
